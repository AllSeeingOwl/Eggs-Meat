name: "Test & Publish to GitHub Pages"

env:
  GODOT_VERSION: 4.2.1

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: |
          cd EggheadsVsMeatheads
          timeout 300 godot --headless --editor --quit || true

      - name: Run gameplay tests
        run: |
          cd EggheadsVsMeatheads
          timeout 600 godot --headless --fixed-fps 60 -s res://tests/test_suite.gd 2>&1 | tee test.log
          grep -q "All .* tests passed" test.log
          ! grep -q "SCRIPT ERROR" test.log

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move HTML5 templates into position
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: |
          cd EggheadsVsMeatheads
          timeout 300 godot --headless --editor --quit || true

      - name: Build
        run: |
          mkdir -v -p build/web
          cd EggheadsVsMeatheads
          godot -v --export-release --headless "Web" ../build/web/index.html
          test -f ../build/web/index.wasm

      - name: Add coi-service-worker
        run: |
          git clone --depth 1 https://github.com/gzuidhof/coi-serviceworker.git
          mv coi-serviceworker/coi-serviceworker.js build/web/coi-serviceworker.js
          sed -i 's#<head>#<head><script src="coi-serviceworker.js"></script>#' build/web/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
